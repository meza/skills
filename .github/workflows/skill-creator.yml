name: skill-creator

on:
  pull_request:
    branches: [main]
    paths:
      - skills/skill-creator/**
      - .github/workflows/skill-creator.yml
  push:
    branches: [main]
    paths:
      - skills/skill-creator/**
      - .github/workflows/skill-creator.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python
    runs-on: meza-ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills/skill-creator
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: skills/skill-creator/.python-version
          cache: pip
          cache-dependency-path: skills/skill-creator/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      # CONTRIBUTING.md specifies `black scripts tests` (auto-fix) for local use.
      # CI must not mutate the checkout, so it asserts instead of rewriting.
      - name: Check formatting
        run: python -m black --check --diff scripts tests

      - name: Lint
        run: python -m flake8 scripts tests

      - name: Test
        run: python -m pytest --cov=scripts --cov-report=term-missing

  eval-viewer:
    name: eval-viewer
    runs-on: meza-ubuntu-slim
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      # `/cache` is a runner facility that persists across jobs.
      PLAYWRIGHT_BROWSERS_PATH: /cache/meza/skills/browsers
    defaults:
      run:
        working-directory: skills/skill-creator/eval-viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: skills/skill-creator/eval-viewer/package.json
          cache: npm
          cache-dependency-path: skills/skill-creator/eval-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      # Runs whenever coverage output exists, so a threshold failure inside
      # `validate` still produces a report instead of just a red step.
      - name: Code Coverage Report
        if: ${{ !cancelled() && hashFiles('skills/skill-creator/eval-viewer/reports/coverage/unit/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          working-directory: skills/skill-creator/eval-viewer
          json-summary-path: reports/coverage/unit/coverage-summary.json
          json-final-path: reports/coverage/unit/coverage-final.json

      # `validate` runs Biome in --write mode. If it rewrote a tracked file,
      # the branch is not actually clean and must not pass.
      - name: Verify nothing was auto-fixed
        run: git diff --exit-code -- .

      - name: Prepare Playwright browser cache
        run: mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"

      # `--with-deps` also installs Chromium's OS libraries (libnspr4 et al),
      # which the slim runner image does not ship.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Visual tests
        run: npm run test:visual

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: skills/skill-creator/eval-viewer/test-results/
          if-no-files-found: ignore
          retention-days: 7
